<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout reach under the notch and home bar;
     the safe-area insets in the CSS put the content back inside. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10A37F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<meta name="description" content="A spending tracker where logging a spend takes two taps.">

<!-- iOS treats these as the signal to launch without Safari chrome. The
     manifest covers modern iOS; these keep older versions behaving. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spendly">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<title>Spendly</title>
</head>
<body>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="add" aria-label="Add">
    <span class="tab-icon">＋</span><span class="tab-label">Add</span>
  </button>
  <button class="tab" data-tab="calendar" aria-label="Calendar">
    <span class="tab-icon">▦</span><span class="tab-label">Calendar</span>
  </button>
  <button class="tab" data-tab="data" aria-label="Data">
    <span class="tab-icon">⤓</span><span class="tab-label">Data</span>
  </button>
  <button class="tab" data-tab="settings" aria-label="Settings">
    <span class="tab-icon">⚙</span><span class="tab-label">Settings</span>
  </button>
</nav>

<div id="sheet-host"></div>
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
